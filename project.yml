# XcodeGen manifest for the Salus iOS app.
#
# `Salus.xcodeproj` is generated from this file AND committed, so CI (Task 7) needs only
# Xcode — no `brew install xcodegen` step, and no chance of the runner generating a project
# that differs from the one a developer built against.
#
# The contract that buys: this file is the source of truth. Never hand-edit the project in
# Xcode's inspector — change `project.yml`, re-run `xcodegen generate`, and commit both.
#
# Regenerate with:
#     xcodegen generate

name: Salus

options:
  bundleIdPrefix: com.alicansekban
  deploymentTarget:
    iOS: "17.0"
  # Spec §6.4: Turkish is the default AND the fallback locale, exactly as Android's `values/`
  # default is Turkish. This writes `developmentRegion = tr` into the project — the region a
  # device that is neither TR nor EN falls back to. Xcode's own default is `en`, which would
  # have made the fallback English on iOS and Turkish on Android for the same user.
  developmentLanguage: tr
  # Mirror the folder tree in the navigator instead of flattening it, so `App/` on disk and
  # `App/` in Xcode stay the same thing.
  createIntermediateGroups: true
  groupSortPosition: top
  # An app with no test target yet still gets a scheme worth sharing; keep it out of
  # `xcuserdata/` (which `.gitignore` drops) so `-scheme Salus` resolves on a clean clone.
  generateEmptyDirectories: false

# Local SPM packages, referenced by path.
#
# M0 linked `SalusDesignSystem` alone — the one package the shell drew from. M1 (Core) adds the
# six core packages the shell composes over: persistence (`SalusDatabase`), the settings and
# profile repositories built on it, the domain and utility layers they are written in
# (`SalusModel`, `SalusCommon`), and the navigation graph (`SalusNavigation`). Linking them here
# is what puts them through `scripts/build-app.sh` — the only gate that compiles them against the
# **iOS** SDK rather than the macOS host `swift test` uses.
#
# `SalusDatabase` is also the edge that pulls the project's first remote dependency, GRDB, into
# the app: `xcodebuild` resolves it transitively and pins it in
# `Salus.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved`, which is committed.
#
# M2 adds two more: `SalusUI` (the shared views and the one snackbar host the shell mounts) and
# `FeatureVitals` (the first feature package). Linking a feature here is also what compiles its
# String Catalog — `swift test` never does, so the simulator run is the only place a missing
# translation shows up.
#
# M3 adds `SalusReminder`. Linking it is what puts its two iOS-only adapters through a compiler at
# all: `SystemAlarmKitScheduler` is behind `#if canImport(AlarmKit)` and
# `SystemBackgroundRefreshRequester` behind `#if os(iOS)`, and the macOS host build `swift test`
# uses compiles neither.
#
# M3 also adds `FeatureSettings`, the second feature package: it owns Reminder Health, and linking
# it is what compiles its String Catalog and its `UIApplication.open*SettingsURLString` effects —
# both invisible to the macOS host build.
#
# M4 adds `FeatureAppointments`, the third feature package. Linking it compiles its String Catalog
# — `swift test` never does — and, once the later M4 tasks land, its EventKit/EventKitUI
# add-to-calendar sheet, which sits behind `#if canImport(EventKitUI)` and so is invisible to the
# macOS host build.
#
# M5 adds `FeatureMedications`, the fourth feature package. Linking it compiles its String Catalog
# — `swift test` never does — and, once the later M5 tasks land, its AlarmKit dose surface, which
# sits behind `#if canImport(AlarmKit)` and so is invisible to the macOS host build.
#
# M6 adds `FeatureCycle`, the fifth feature package. Linking it compiles its String Catalog — the
# 56 keys of `:feature:cycle`, and `swift test` never compiles a catalog at all, so a missing or
# mis-specified translation surfaces nowhere else — and puts the cycle screens through the iOS SDK
# rather than the macOS host, which is where the calendar grid and the period reminder's
# notification copy are actually built.
#
# M7 adds `FeatureHome`, the sixth feature package and the last tab that was still a placeholder.
# M0 created the package but never linked it, so until now nothing compiled it against the iOS SDK
# at all. Linking it compiles its String Catalog — the 27 keys of `:feature:home` that survive the
# port, and `swift test` never compiles a catalog, so a missing or mis-specified translation
# surfaces nowhere else — and puts the dashboard through the iOS SDK rather than the macOS host,
# which is where the today cards and the weight sparkline are actually built.
#
# M8 adds `FeatureOnboarding`, the seventh feature package. M0 created it and nothing has linked it
# until now, so the eight-step gate had never been compiled against the iOS SDK. Linking it compiles
# its String Catalog — the 46 keys of `:feature:onboarding`, and `swift test` never compiles a
# catalog at all — and puts the two iOS-only branches of the flow through a compiler for the first
# time: the name field's `.textContentType(.name)` and the notes editor's
# `.textInputAutocapitalization(.sentences)`, both behind `#if os(iOS)` and both invisible to the
# macOS host build. The shell mounts the gate in a later task; the link is what makes the code real.
packages:
  SalusDesignSystem:
    path: Packages/SalusDesignSystem
  SalusDatabase:
    path: Packages/SalusDatabase
  SalusSettings:
    path: Packages/SalusSettings
  SalusProfile:
    path: Packages/SalusProfile
  SalusCommon:
    path: Packages/SalusCommon
  SalusModel:
    path: Packages/SalusModel
  SalusNavigation:
    path: Packages/SalusNavigation
  SalusUI:
    path: Packages/SalusUI
  FeatureVitals:
    path: Packages/Features/FeatureVitals
  FeatureSettings:
    path: Packages/Features/FeatureSettings
  FeatureAppointments:
    path: Packages/Features/FeatureAppointments
  FeatureMedications:
    path: Packages/Features/FeatureMedications
  FeatureCycle:
    path: Packages/Features/FeatureCycle
  FeatureHome:
    path: Packages/Features/FeatureHome
  FeatureAIHealth:
    path: Packages/Features/FeatureAIHealth
  FeatureOnboarding:
    path: Packages/Features/FeatureOnboarding
  FeaturePaywall:
    path: Packages/Features/FeaturePaywall
  FeatureTrends:
    path: Packages/Features/FeatureTrends
  SalusReminder:
    path: Packages/SalusReminder
  SalusPremium:
    path: Packages/SalusPremium
  # iOS-M10 Task 7: `SalusAI` is the AI package the app links so the shell can build the real
  # `FirebaseAiClient` graph, and `firebase-ios-sdk` is its remote dependency — the third and
  # final entry on the closed allowlist. The app imports `FirebaseCore` directly in `SalusApp.swift`
  # to configure Firebase at launch, so the app names the product itself rather than reaching it
  # only transitively through `SalusAI`.
  SalusAI:
    path: Packages/SalusAI
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "12.18.0"

settings:
  base:
    # Matches the packages' `swift-tools-version: 6.0`, so the app and the code it links are
    # checked under the same language mode rather than two.
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_MODULE_VERIFIER: NO
    # `options.developmentLanguage` above sets the *project's* `developmentRegion`; it does not
    # feed the `DEVELOPMENT_LANGUAGE` build setting, whose Xcode default is `en`. `App/Info.plist`
    # passes `$(DEVELOPMENT_LANGUAGE)` through to `CFBundleDevelopmentRegion`, so without this
    # line the built bundle would still declare English as its fallback. Both have to say `tr`.
    DEVELOPMENT_LANGUAGE: tr

targets:
  Salus:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    # `App` is walked whole, so `App/Resources/salus_alarm.caf` is picked up as a bundle resource
    # without an entry of its own: XcodeGen puts a file it has no compiler for into the Resources
    # build phase, and Xcode copies that phase to the bundle ROOT — which is the only place
    # `UNNotificationSound(named:)` and AlarmKit look for a custom sound. Verify after any change
    # to this block with:
    #     grep -c salus_alarm.caf Salus.xcodeproj/project.pbxproj    # 4: file ref, build file, both phases
    sources:
      - path: App

    # iOS-M9: the committed base configuration, which declares `SALUS_REVENUECAT_API_KEY` blank
    # and then `#include?`s the git-ignored `Secrets.local.xcconfig` that may override it. The
    # file named here must exist in a fresh clone — XcodeGen validates config file paths and
    # refuses to generate otherwise — which is why it is this one and not the local file.
    configFiles:
      Debug: App/Secrets.xcconfig
      Release: App/Secrets.xcconfig

    settings:
      base:
        # iOS-M9: the RevenueCat API key, read from the git-ignored `Secrets.local.xcconfig`
        # (blank on a keyless build). `$(…)` resolves the xcconfig's value and lands it in the
        # built Info.plist, where `SalusApp.init` reads it via `Bundle.main.infoDictionary`
        # (and `ProcessInfo.processInfo.environment`). A blank value is a legitimate build:
        # RevenueCat stays unconfigured and the app runs fully free.
        SALUS_REVENUECAT_API_KEY: $(SALUS_REVENUECAT_API_KEY)
        PRODUCT_BUNDLE_IDENTIFIER: com.alicansekban.salus
        PRODUCT_NAME: Salus
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # iPhone only, matching the Android phone-first app.
        TARGETED_DEVICE_FAMILY: "1"
        # No app icon is expected in M0: there is no asset catalog yet, and CI (Task 7) holds
        # a zero-warning baseline that a placeholder icon set would spend.
        #
        # The empty value is a deliberate override, not a no-op. XcodeGen writes
        # `ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon` into every application target by
        # default, so leaving this unset would leave the project *expecting* an icon named
        # `AppIcon` while this manifest claimed the opposite. That is inert only while no
        # `.xcassets` is in `sources`, because actool never runs. Measured, the first asset
        # catalog added to the target does not merely warn — it breaks the build:
        #
        #     error: None of the input catalogs contained a matching stickers icon set,
        #     app icon set, or icon stack named "AppIcon".
        #
        # …and it would break in whichever commit first added an asset catalog, for a reason
        # written here rather than there. Empty makes actool run without `--app-icon`, so it
        # looks for no icon at all; when the real icon lands, this becomes its set name.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        # The Apple Developer team the app signs with — added 2026-08-25 for the first on-device
        # run (iPhone 14 Pro Max, the iOS-M3a checklist). It lives here, not in the pbxproj Xcode
        # writes it into, because `xcodegen generate` regenerates the project from this file.
        DEVELOPMENT_TEAM: MSK744V99M

    # The Time Sensitive Notifications capability. It is auto-approved — Xcode adds it to the
    # profile, no Apple application, which is exactly why the spec chose it over Critical Alerts —
    # but it still has to be DECLARED: without this entitlement iOS silently downgrades
    # `interruptionLevel = .timeSensitive` to `.active`, and the iOS 17-25 dose alarm loses the one
    # property that makes it a dose alarm (it would be held by Focus like any other notification).
    # Generated by XcodeGen from the properties below; there is no hand-written .entitlements file.
    entitlements:
      path: App/Salus.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true

    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Salus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # iOS-M9: the RevenueCat API key, resolved from `Secrets.local.xcconfig` at build time.
        # Read by `SalusApp.init` through `Bundle.main.infoDictionary`; blank on a keyless build.
        SALUS_REVENUECAT_API_KEY: $(SALUS_REVENUECAT_API_KEY)
        # An empty `UILaunchScreen` opts the app into the modern launch-screen path. Without
        # it iOS runs the app letterboxed at a legacy screen size — which would also make the
        # verification screenshot lie about how the shell lays out.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        # iOS-M3: the background half of the reminder engine — the twin of Android's 12-hour
        # `enqueueUniquePeriodicWork` refill. `fetch` is what lets the app be woken at all;
        # `BGTaskSchedulerPermittedIdentifiers` is what lets it register THIS task, and the string
        # must match `ReminderBackgroundRefresh.taskIdentifier` exactly — an unlisted identifier is
        # refused at registration and the window is then only ever refilled while the app is open.
        # Pinned by `BackgroundRefreshSchedulerTests.taskIdentifierIsPinned`.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.alicansekban.salus.reminder.refresh
        # iOS-M3: spec's 2026-08-23 AlarmKit note, case 1. On iOS 26+ a medication dose presents
        # as a real system alarm, and AlarmKit's gate is entirely runtime — no Apple entitlement,
        # no review application (which is exactly why Critical Alerts were rejected). This purpose
        # string IS the other half of that gate: without it the authorization prompt never appears
        # and every dose silently falls back to the time-sensitive notification path.
        #
        # Turkish, because §6.4 makes `tr` the development language and the fallback locale, and
        # `DEVELOPMENT_LANGUAGE` above says so. The value here is therefore the BASE — what a locale
        # that is neither Turkish nor English gets.
        #
        # iOS-M3 Task 9 added the two localized peers, `App/{tr,en}.lproj/InfoPlist.strings`, which
        # XcodeGen picks up from the `App` walk above as one variant group. Both, not just English:
        # measured on the built bundle, with `en.lproj` as the only `.lproj`,
        # `Bundle.preferredLocalizations` answers `["en"]` even for a `tr-TR` preference, so a
        # Turkish phone would have read the English sentence. So `tr.lproj` deliberately repeats the
        # value below — one sentence, three places. Edit all three together.
        NSAlarmKitUsageDescription:
          İlaç hatırlatmalarınızın tam ekran alarm olarak çalabilmesi için Salus'un alarm iznine
          ihtiyacı var.
        # iOS-M8: the app lock. `LAContext.evaluatePolicy(.deviceOwnerAuthentication)` — the twin of
        # Android's `BIOMETRIC_WEAK or DEVICE_CREDENTIAL` — raises `NSFaceIDUsageDescription` on a
        # Face ID device, and iOS **terminates the app** on the first evaluation if the key is
        # missing. Touch ID and the passcode fallback need no key of their own, which is why this
        # one string covers the whole gate.
        #
        # Turkish for `NSAlarmKitUsageDescription`'s reason, and localized in the same two
        # `.lproj/InfoPlist.strings` peers. The three values are one sentence in three places:
        # edit them together.
        NSFaceIDUsageDescription:
          Uygulama kilidini açmak için Salus'un Face ID iznine ihtiyacı var.

    dependencies:
      - package: SalusDesignSystem
        product: SalusDesignSystem
      - package: SalusDatabase
        product: SalusDatabase
      - package: SalusSettings
        product: SalusSettings
      - package: SalusProfile
        product: SalusProfile
      - package: SalusCommon
        product: SalusCommon
      - package: SalusModel
        product: SalusModel
      - package: SalusNavigation
        product: SalusNavigation
      - package: SalusUI
        product: SalusUI
      - package: FeatureVitals
        product: FeatureVitals
      - package: FeatureSettings
        product: FeatureSettings
      - package: FeatureAppointments
        product: FeatureAppointments
      - package: FeatureMedications
        product: FeatureMedications
      - package: FeatureCycle
        product: FeatureCycle
      - package: FeatureHome
        product: FeatureHome
      - package: FeatureAIHealth
        product: FeatureAIHealth
      - package: FeatureOnboarding
        product: FeatureOnboarding
      - package: FeaturePaywall
        product: FeaturePaywall
      - package: FeatureTrends
        product: FeatureTrends
      - package: SalusReminder
        product: SalusReminder
      # iOS-M9 Task 2 (the store seam): the app links `SalusPremium` so the shell can bind
      # `WindowPurchaseHost` (divergence (c)) to the gateway's `PurchaseHost`. The package gains
      # `purchases-ios` transitively, exactly as it already reaches GRDB through `SalusDatabase`.
      - package: SalusPremium
        product: SalusPremium
      # iOS-M10 Task 7: the app links `SalusAI` (the AI repositories and `FirebaseAiClient`) and
      # `FirebaseCore` (the `FirebaseApp.configure()` call in `SalusApp.init`). The app reaches
      # `firebase-ios-sdk` transitively through `SalusAI` and directly through `FirebaseCore`.
      - package: SalusAI
        product: SalusAI
      - package: firebase-ios-sdk
        product: FirebaseCore

    scheme:
      testTargets: []
      gatherCoverageData: false
