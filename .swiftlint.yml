# SwiftLint configuration for Salus iOS.
#
# Mirrors the spirit of the Android module conventions:
#  - a 120 column budget (the widest reviewed line today is 119),
#  - no force unwrapping / force try in production code,
#  - and a mechanical guard that keeps the platform-agnostic domain layer
#    (SalusModel, SalusCommon) free of UI frameworks — the iOS twin of
#    Android's `salus.jvm.library` convention plugin, which makes the
#    Android SDK simply unavailable to pure-JVM modules.
#
# CI baseline: `swiftlint --strict` must exit 0 (zero warnings, zero errors).

included:
  - App
  - Packages

excluded:
  - .build
  - .git
  - .superpowers
  - .swiftpm
  - Salus.xcodeproj
  - Packages/**/.build
  - Packages/**/.swiftpm

# Rules that are on by default but do not fit this codebase.
disabled_rules:
  - todo # tracked in docs/, not enforced by the linter

# Opt-in rules we do want.
opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - fallthrough
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - private_action
  - private_outlet
  - prohibited_super_call
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - static_operator
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - yoda_condition

analyzer_rules:
  - unused_import

line_length:
  warning: 120
  error: 160
  ignores_urls: true
  ignores_comments: false
  ignores_interpolated_strings: true

file_length:
  warning: 500
  error: 800

type_body_length:
  warning: 300
  error: 400

function_body_length:
  warning: 60
  error: 100

function_parameter_count:
  warning: 6
  error: 8

cyclomatic_complexity:
  warning: 12
  error: 20

nesting:
  type_level: 2

identifier_name:
  min_length:
    warning: 2
    error: 1
  excluded:
    - id
    - x
    - y
    - z

type_name:
  min_length: 3
  max_length:
    warning: 50
    error: 60

# The only tuples in the tree today are the labelled row types that back
# swift-testing's parameterised `@Test(arguments:)` tables — `TypeSample` has
# seven labelled members because §9 of the design-token doc has seven columns.
# Inline `swiftlint:disable:next` cannot be used there: it would sit between
# the `///` doc comment and the declaration and trip `orphaned_doc_comment`.
# So the threshold is raised instead of churning reviewed test code, and the
# error level still catches a genuinely unwieldy tuple.
large_tuple:
  warning: 7
  error: 9

trailing_comma:
  mandatory_comma: false

# No force unwrapping. SwiftLint has no per-path scoping for built-in rules,
# so the rule is enabled repo-wide and test code that genuinely needs a bang
# opts out on the line itself:
#
#   // swiftlint:disable:next force_unwrapping
#
# Production code has no such escape hatch by convention: use `guard let`,
# and in tests prefer `try XCTUnwrap` over the opt-out.
force_cast:
  severity: error
force_try:
  severity: error
force_unwrapping:
  severity: error

custom_rules:
  # The mechanical twin of Android's `salus.jvm.library`: SalusModel and
  # SalusCommon are the platform-agnostic core and must never see a UI
  # framework. Violating this makes the domain layer untestable off-device
  # and blocks any future reuse (watchOS, macOS, server-side tooling).
  #
  # The regex has to survive every spelling of an import that Swift accepts,
  # because each one is a way around the guard:
  #   (@[A-Za-z_][A-Za-z0-9_]*[ \t]+)*  attribute prefixes, repeatable —
  #                                     `@testable import SwiftUI`,
  #                                     `@_exported import UIKit`,
  #                                     `@preconcurrency @testable import ...`
  #   ((typealias|struct|...)[ \t]+)?   Swift's import-kind grammar. Without
  #                                     this, `import struct SwiftUI.Color`
  #                                     and `import class UIKit.UIColor`
  #                                     sail straight past, since the token
  #                                     after `import` is the declaration
  #                                     kind, not the module name.
  #   SwiftUICore, UIKitCore            real shipping frameworks. SwiftUICore
  #                                     vends Color/Font/Animation, so it is
  #                                     a complete substitute for the thing
  #                                     this rule exists to block, and `\b`
  #                                     will not match it mid-word against
  #                                     `SwiftUI`. Longest alternatives are
  #                                     listed first for legibility.
  no_ui_framework_in_domain:
    name: "UI Framework In Domain Layer"
    regex: '^[ \t]*(@[A-Za-z_][A-Za-z0-9_]*[ \t]+)*import[ \t]+((typealias|struct|class|actor|enum|protocol|func|var|let)[ \t]+)?(SwiftUICore|SwiftUI|UIKitCore|UIKit|AppKit|WatchKit)\b'
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "SalusModel and SalusCommon are platform-agnostic domain layers: SwiftUI/UIKit imports are forbidden here (iOS twin of Android's salus.jvm.library guard)."
    severity: error
    # WARNING for whoever wires up CI or a pre-commit hook: these `included`
    # regexes are matched against the path SwiftLint resolves for each file,
    # and `--path` changes that resolution enough that they stop matching.
    # Measured against a real `import SwiftUI` planted in SalusModel:
    #
    #   swiftlint lint --strict                        -> 1 hit   (correct)
    #   swiftlint lint --strict Packages/.../File.swift -> 1 hit   (correct)
    #   swiftlint lint --strict --path <file-or-dir>    -> 0 hits  (SILENT PASS)
    #
    # Other rules still fire under `--path`, so the run looks healthy while
    # this guard is switched off. Lint the repo, or pass files positionally.
    # Never lint changed files with `--path`.
    included:
      - "Packages/SalusModel/.*\\.swift"
      - "Packages/SalusCommon/.*\\.swift"

  # The iOS twin of Android's Vico rule: the chart engine is an implementation
  # detail of the shared UI layer, and it is a DIFFERENT engine on each platform
  # (Vico there, Swift Charts here). A feature that imports Charts pins itself to
  # this one and bypasses `ChartUiModel`, the contract both platforms speak — so
  # the next chart arrives as a second, subtly different axis/label/color story.
  # `SalusUI` owns `SalusLineChart` and is the ONE package allowed to import it.
  #
  # Same regex shape as `no_ui_framework_in_domain` above, and for the same
  # reason: every spelling of an import that Swift accepts is a way around the
  # guard — attribute prefixes (`@preconcurrency import Charts`) and the
  # import-kind grammar (`import struct Charts.LineMark`).
  #
  # The module name matched is the bare `Charts` — what `import Charts` binds to
  # is Apple's Swift Charts, since the dependency allowlist is closed at three
  # and holds no charting package.
  no_charts_in_features:
    name: "Charts In Feature Package"
    regex: '^[ \t]*(@[A-Za-z_][A-Za-z0-9_]*[ \t]+)*import[ \t]+((typealias|struct|class|actor|enum|protocol|func|var|let)[ \t]+)?Charts\b'
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "Features must not import Charts: the chart engine lives behind SalusUI's ChartUiModel/SalusLineChart (iOS twin of Android's Vico rule)."
    severity: error
    # The same `--path` warning as above applies verbatim: lint the repo, or
    # pass files positionally. `scripts/lint-custom-rules.sh` proves this rule
    # actually fires, with a planted fixture.
    included:
      - "Packages/Features/.*\\.swift"

  # The tab bar belongs to the shell. `App/RootView.swift` applies
  # `.toolbar(backStacks.isAtRoot(tab) ? .visible : .hidden, for: .tabBar)` to
  # each tab's `NavigationStack`, so every pushed destination gets the full
  # height — the twin of Android's `showBottomBar` (`SalusApp.kt:133-136`).
  # A feature that sets the visibility itself takes that decision away from the
  # shell for one screen: the bar then depends on which screen you arrived at
  # rather than on how deep the stack is, and the two rules fight on pop.
  #
  # The regex matches the modifier by its ARGUMENTS, not by an import: what is
  # forbidden is naming `.tabBar` as the placement of a visibility call.
  #   \.toolbar(Visibility)?\(   both spellings — `.toolbar(_:for:)` and the
  #                              iOS 18 `.toolbarVisibility(_:for:)`.
  #   [^)\n]*for:[^)\n]*        the arguments, on the SAME line and inside the
  #                              SAME parens: `[^)\n]` cannot leak past the
  #                              closing paren or onto the next line, so the
  #                              match stays within one call however greedy it
  #                              looks. The second `[^)\n]*` is what makes the
  #                              placement list variadic-proof — `for:` takes
  #                              `ToolbarPlacement...`, so a feature wanting a
  #                              full-screen screen writes
  #                              `.toolbar(.hidden, for: .navigationBar, .tabBar)`,
  #                              and an anchored `for:\s*\.tabBar` sailed
  #                              straight past it. It also covers the spelled-out
  #                              `for: ToolbarPlacement.tabBar`.
  #   \.tabBar                   the placement that makes it the shell's.
  # `.toolbarBackground(…, for: .tabBar)` is intentionally NOT matched: that is
  # styling, and the shell's own two lines are outside this scope anyway. (It
  # cannot match by accident either — after `.toolbar` the regex demands `(` or
  # `Visibility(`, and `Background` is neither.)
  #
  # KNOWN LIMITS — this raises the cost of the accident, not of the determined
  # workaround, so do not read a clean run as proof no feature touches the bar:
  #   * line-local. A call hand-wrapped across lines is missed, and stays a
  #     review finding. A balanced-paren/multi-line regex is the kind of greedy
  #     pattern that starts matching unrelated code and gets deleted the first
  #     time it cries wolf.
  #   * indirection. `let p: ToolbarPlacement = .tabBar` then `for: p` is missed,
  #     as is any placement built at runtime. A regex cannot follow a binding.
  no_tab_bar_toolbar_in_features:
    name: "Tab Bar Visibility In Feature Package"
    regex: '\.toolbar(Visibility)?\([^)\n]*for:[^)\n]*\.tabBar'
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "Tab-bar visibility is the shell's: App/RootView.swift hides the bar on every pushed destination via backStacks.isAtRoot(tab). A feature must never set .toolbar(…, for: .tabBar) itself."
    severity: error
    # The same `--path` warning as above applies verbatim: lint the repo, or
    # pass files positionally. `scripts/lint-custom-rules.sh` proves this rule
    # actually fires, with a planted fixture.
    included:
      - "Packages/Features/.*\\.swift"

reporter: "xcode"
