# Salus iOS CI.
#
# Mirrors the Android repository's workflow shape (salus-android/.github/workflows/ci.yml):
# one job, triggered on push to main and on every pull request, running the
# lint -> test -> build sequence that `./gradlew build` runs over there. It is
# split into named steps here only because the iOS toolchain has no single
# command that does all three.
#
# Every step shells out to a script in scripts/, so a developer can reproduce
# the whole run with `scripts/ci.sh` and there is exactly one definition of each
# command. Do not inline a command here that differs from its script.
#
# ---------------------------------------------------------------------------
# Runner image and Xcode
# ---------------------------------------------------------------------------
# `macos-26` (the image `macos-latest` points at since June 2026) is pinned by
# name rather than by `macos-latest`, so an image rotation cannot silently move
# the toolchain under the project.
#
# That image happens to carry EXACTLY the toolchain the README pins:
#
#   Xcode 26.4.1 (build 17E202)  at /Applications/Xcode_26.4.1.app
#   SwiftLint 0.65.0             preinstalled
#   SwiftFormat 0.62.1           preinstalled
#
# so no `brew install` step exists: brewing them would replace known-good,
# already-present binaries with whatever HEAD of homebrew-core has that day —
# i.e. it would CREATE the version drift it was meant to prevent, and cost a
# minute of macOS runner time doing it. scripts/check-toolchain.sh verifies the
# versions instead and fails loudly if the image ever drifts away from the
# README, which is the moment a human should decide whether to bump the README
# or install a specific version.
#
# The image's *default* Xcode is 26.6, so scripts/check-toolchain.sh selects the
# pinned one and exports DEVELOPER_DIR to the later steps. It matches Xcode on
# MAJOR.MINOR (26.4.x) rather than on the exact patch — the patch does not change
# Swift's language rules or the targeted SDKs, and GitHub rotates image Xcode
# patches on its own schedule. SwiftLint and SwiftFormat are matched exactly,
# because `--strict` runs on a zero-warning budget and a linter patch release can
# add rules. The version pins live at the top of that script; this file does not
# repeat them.
#
# Xcode 16 or newer is all that swift-tools 6.0 / iOS 17 actually require, so the
# pin is about reproducibility, not capability.
#
# XcodeGen is NOT installed on the image and is NOT needed: Salus.xcodeproj is
# generated from project.yml but committed. See scripts/build-app.sh.
#
# ---------------------------------------------------------------------------
# Caching
# ---------------------------------------------------------------------------
# Deliberately none.
#
#   * There is almost nothing to *download*, and caching it was measured and
#     rejected. Since iOS-M1 the tree has exactly one remote dependency, GRDB,
#     named by Packages/SalusDatabase/Package.swift and reached by the app
#     transitively; the other 23 packages resolve to local `.package(path:)`
#     entries and never contact the network. Measured on an M-series laptop with
#     ~/Library/Caches/org.swift.swiftpm purged AND DerivedData deleted — i.e.
#     GRDB cloned over the network and compiled from scratch — the whole
#     scripts/build-app.sh step takes 54s, and scripts/test-packages.sh
#     SalusDatabase 16s. The ruling for this milestone was to add an
#     actions/cache step only if GRDB cost the build-app step more than two
#     minutes. Its entire cost, clone included, is under one; an
#     upload/download of the cache would plausibly cost more than it saves.
#     Re-measure, do not re-argue, if purchases-ios or firebase-ios-sdk lands —
#     firebase-ios-sdk in particular is a different order of magnitude.
#
#   * Caching build *products* was measured and rejected. Because every package
#     is tested in its own directory, each one builds its own copy of the shared
#     subgraph, and the 24 `.build` directories total ~4.0 GB — most of a
#     repository's entire 10 GB cache quota, for an archive that would have to be
#     uploaded and downloaded on every run and invalidated by any source change.
#
# If the loop ever gets slow enough to matter, the fix is to make the packages
# share one build (an aggregate test package), not to cache 4 GB.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant, and
# macOS runner minutes are billed at a multiple of Linux ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # 1/4 — toolchain. Selects the pinned Xcode (exporting DEVELOPER_DIR to the
      # steps below via $GITHUB_ENV) and asserts all three tool versions against
      # the pins at the top of the script, which mirror README.md's Toolchain
      # table. Everything below depends on these binaries, so a mismatch should
      # be visible at the top of the log, not inferred from a lint rule that
      # fired unexpectedly forty lines later.
      - name: Toolchain
        shell: bash
        run: scripts/check-toolchain.sh

      # 2/4 — lint. swiftformat --lint then swiftlint --strict, both repo-wide
      # from the repo root. scripts/lint.sh documents why `--path` is banned.
      - name: Lint
        shell: bash
        run: scripts/lint.sh

      # 3/4 — test. `swift test` for ALL 24 local packages, not just the ones
      # with hand-written assertions: the placeholder test targets exist to
      # prove every module still compiles and links, which is the only thing M0
      # can assert about most of them.
      #
      # These run against the HOST (macOS) toolchain, because `swift test`
      # cannot run a test bundle on a simulator. Project convention, applied in
      # 12 manifests: an iOS-only package that reaches SwiftUI (directly, like
      # SalusDesignSystem, or transitively, like SalusUI and the ten feature
      # packages) also declares `.macOS(.v14)` SOLELY so `swift test` runs on a
      # macOS host. iOS 17 remains the ship target, and the iOS build of every
      # package is covered by the xcodebuild step below, which links them all.
      - name: Test all packages
        shell: bash
        run: scripts/test-packages.sh

      # 4/4 — build the app scheme. `generic/platform=iOS Simulator` needs no
      # named device, so the workflow does not break when the image's simulator
      # set changes. See scripts/build-app.sh.
      - name: Build app
        shell: bash
        run: scripts/build-app.sh
